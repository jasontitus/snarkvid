[package]
name = "snarkvid-comparator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
std = []

[dependencies]
# libm provides no_std-compatible math functions (log10, etc.)
# In production, we'll replace floating-point PSNR with pure integer
# fixed-point arithmetic to avoid libm in the zkVM guest entirely.
libm = "0.2"
