# Top-level workspace for the snarkvid project.
# The spike/ directory has its own nested workspace (for milestone 1).
# Milestone 2+ crates live here.

[workspace]
resolver = "2"
members = [
    "crates/toy-codec",
    "crates/manifest",
    "crates/comparator",
    "crates/m2-statement",
    "bin/toy-encode",
]
exclude = [
    "spike",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Shared deps across milestone-2 crates
serde = { version = "1", default-features = false, features = ["derive"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
# Poseidon (circuit-friendly hash for Merkle): add when chosen
# arkworks or Neptune
