# Nested workspace for the M2 prover. Mirrors spike/sp1/ — the
# `guest/` crate is the SP1 RISC-V guest and is excluded from the
# parent workspace; the host's build.rs cross-compiles it with the
# SP1 toolchain when --features build-guest is set.
#
# The host crate compiles cleanly without SP1 toolchain installed
# (smoke subcommand only). The prove subcommand requires the
# build-guest feature.

[workspace]
resolver = "2"
members = [
    "host",
]
exclude = [
    "guest",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false
version = "0.0.0"

[workspace.dependencies]
sp1-sdk = "6.1.0"
sp1-build = "6.1.0"
sha2 = "0.10.8"
serde = { version = "1", features = ["derive"] }
bincode = { version = "1.3", default-features = false }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
ed25519-dalek = "2"
