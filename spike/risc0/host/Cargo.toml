[package]
name = "snarkvid-spike-risc0-host"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "risc0-host"
path = "src/main.rs"

[dependencies]
risc0-zkvm = { version = "3.0", default-features = false, features = ["prove"] }
snarkvid-spike-risc0-methods = { path = "../methods" }
bincode = { version = "1.3" }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[features]
default = []
risc0 = []  # enable when risc0-zkvm toolchain is installed
cuda = ["risc0-zkvm/cuda"]  # GPU prover (Linux + NVIDIA)
