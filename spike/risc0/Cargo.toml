# Nested workspace for the RISC Zero side. The guest crate inside
# methods/guest is intentionally NOT a member here — it has a different
# target (riscv32im) and is built by methods/build.rs.

[workspace]
resolver = "2"
members = [
    "host",
    "methods",
]
exclude = [
    "methods/guest",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# risc0-zkvm = "1.2"  # uncomment when risc0 toolchain is installed
# risc0-build = "1.2"
# bincode = "1.3"
# bytemuck = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# risc0-zkvm — uncomment host + methods/guest Cargo.toml deps when toolchain is available
