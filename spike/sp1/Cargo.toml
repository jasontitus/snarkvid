# Nested workspace for the SP1 side. The `program/` crate targets the SP1
# RISC-V guest and is excluded from the parent workspace; SP1's tooling
# (`cargo prove build`) builds it independently.

[workspace]
resolver = "2"
members = [
    "script",
]
exclude = [
    "program",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false
version = "0.0.0"

[workspace.dependencies]
sp1-sdk = "6.1.0"
sp1-build = "6.1.0"
sha2 = "0.10.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
